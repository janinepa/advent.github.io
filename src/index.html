<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advent Calendar 2025</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
      color: white;
      height: 100vh;
      background: black;
      user-select: none;
    }

    /* The Viewport Container */
    .scene {
      position: relative;
      width: 100vw;
      /* Viewport width */
      height: 100vh;
      overflow: hidden;
      /* Hide scrollbars */
      cursor: grab;
    }

    .scene:active {
      cursor: grabbing;
    }

    /* The Scrollable Content Wrapper */
    #village {
      position: relative;
      width: 250vw;
      /* The wide village width */
      height: 100%;
    }

    /* Background image element */
    #bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Door styling */
    .door {
      position: absolute;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 1;
      cursor: pointer;
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      /* Strong shadow for visibility on any background */
      text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 20px #b89b5e;
      transition: transform 0.3s ease, color 0.3s ease;
      font-family: "Poppins", sans-serif;
    }

    .door:hover {
      transform: scale(1.3);
      color: #ffd700;
      text-shadow: 0 0 10px #fff, 0 0 20px #ffd700;
    }

    .door.open {
      color: #b89b5e;
      /* Dim or change color when opened */
      transform: scale(0.9);
      opacity: 0.7;
    }

    /* Locked animation */
    @keyframes shake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      50% {
        transform: translateX(5px);
      }

      75% {
        transform: translateX(-5px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .door.locked {
      animation: shake 0.4s ease-in-out;
      color: #999;
      /* Grey out locked doors slightly if desired, or keep white */
    }

    .door.locked-visual {
      /*opacity: 0.5;*/
      cursor: not-allowed;
    }

    h1 {
      position: fixed;
      text-align: center;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 1.5rem;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>

<body>
  <h1>Advent Calender 2025</h1>

  <div class="scene" id="scene">
    <div id="village">
      <img id="bg-img" src="assets/images/background.png" alt="Village Background">
      <!-- Doors will be appended here -->
    </div>
  </div>

  <script>
    const scene = document.getElementById('scene');
    const village = document.getElementById('village');

    // Define door positions (x%, y%) scattered over the full 250vw width
    // X range 2-94% to stay within the background
    // Y range 20-80% to stay visible
    const doorPositions = [
      { x: 2, y: 30 }, { x: 6, y: 70 }, { x: 10, y: 45 }, { x: 14, y: 20 },
      { x: 18, y: 60 }, { x: 22, y: 35 }, { x: 26, y: 75 }, { x: 30, y: 50 },
      { x: 34, y: 25 }, { x: 38, y: 65 }, { x: 42, y: 40 }, { x: 46, y: 80 },
      { x: 50, y: 30 }, { x: 54, y: 70 }, { x: 58, y: 45 }, { x: 62, y: 20 },
      { x: 66, y: 60 }, { x: 70, y: 35 }, { x: 74, y: 75 }, { x: 78, y: 50 },
      { x: 82, y: 25 }, { x: 86, y: 65 }, { x: 90, y: 40 }, { x: 94, y: 80 }
    ];

    // Shuffle the positions so the numbers 1-24 are random on the grid
    // (Fisher-Yates shuffle)
    for (let i = doorPositions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [doorPositions[i], doorPositions[j]] = [doorPositions[j], doorPositions[i]];
    }

    // Helper to check if a door should be open
    function isDoorOpen(day) {
      const now = new Date();
      const currentMonth = now.getMonth(); // 0-indexed (11 is Dec)
      const currentDay = now.getDate();
      const currentYear = now.getFullYear();

      // Logic: Allow if it's December of the correct year (or later years) AND day is reached
      // OR if it's past December (e.g. Jan next year)

      if (currentYear > 2025) return true;
      if (currentYear === 2025 && currentMonth === 10 && currentDay >= day) return true;

      return false;
    }

    // Create the 24 doors dynamically
    for (let i = 1; i <= 24; i++) {
      const door = document.createElement('div');
      door.className = 'door';
      door.style.left = doorPositions[i - 1].x + '%';
      door.style.top = doorPositions[i - 1].y + '%';

      // Just the number
      door.innerText = i;

      // Visual state for locked doors
      if (!isDoorOpen(i)) {
        door.classList.add('locked-visual');
      }

      door.addEventListener('click', () => openDoor(i, door));
      village.appendChild(door);
    }

    function openDoor(day, doorEl) {
      if (!isDoorOpen(day)) {
        // Locked behavior
        doorEl.classList.add('locked'); // Triggers shake animation
        setTimeout(() => {
          doorEl.classList.remove('locked');
        }, 400);
        return;
      }

      // Open behavior
      doorEl.classList.add('open');
      setTimeout(() => {
        const dayStr = day < 10 ? `0${day}` : day;
        window.location.href = `doors/day-${dayStr}.html`;
      }, 1200);
    }

    // ---- Drag logic (mouse + touch) ----
    let isDragging = false;
    let startX;
    let scrollLeft = 0;

    function startDrag(clientX) {
      isDragging = true;
      startX = clientX - scene.offsetLeft;
      scrollLeft = scene.scrollLeft;
      scene.style.cursor = 'grabbing';
    }

    function moveDrag(clientX) {
      if (!isDragging) return;
      const x = clientX - scene.offsetLeft;
      const walk = (x - startX) * 1.5;
      scene.scrollLeft = scrollLeft - walk;
    }

    function endDrag() {
      isDragging = false;
      scene.style.cursor = 'grab';
    }

    // Mouse events
    scene.addEventListener('mousedown', (e) => startDrag(e.pageX));
    scene.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      moveDrag(e.pageX);
    });
    scene.addEventListener('mouseup', endDrag);
    scene.addEventListener('mouseleave', endDrag);

    // Touch events (for phones/tablets)
    scene.addEventListener('touchstart', (e) => {
      // use the first touch point
      startDrag(e.touches[0].pageX);
    }, { passive: true });

    scene.addEventListener('touchmove', (e) => {
      // prevent page from scrolling while dragging horizontally
      if (!isDragging) return;
      e.preventDefault();
      moveDrag(e.touches[0].pageX);
    }, { passive: false });

    scene.addEventListener('touchend', endDrag);
    scene.addEventListener('touchcancel', endDrag);

  </script>
</body>

</html>

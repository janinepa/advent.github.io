<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 4</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            background: url('../assets/images/background.webp') center/cover no-repeat;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* full-viewport video */
        .door video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: black;
        }

        /* overlay that appears after video ends */
        .answer-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            /* disabled until shown */
        }

        .answer-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 24px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            text-align: center;
            min-width: 280px;
            pointer-events: auto;
        }

        .answer-card input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            margin-top: 12px;
            box-sizing: border-box;
        }

        .answer-card button {
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: #ff7a18;
            color: #fff;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 4</h1>
        <video id="dayVideo" controls playsinline preload="auto">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-04.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Lantern Game Overlay -->
    <div id="gameOverlay" class="answer-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="answer-card" style="max-width: 90vw; width: 360px; padding: 20px;">
            <h2 style="color:#ffd700;margin-top:0">The Lanterns are frozen!</h2>
            <p style="margin-bottom:15px">I need your help to light the lanterns! Click a lantern to toggle it and its
                neighbors. Light them all up!</p>

            <div id="lanternGrid"
                style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 240px; margin: 0 auto;">
                <!-- Lanterns generated by JS -->
            </div>

            <div id="result" style="margin-top:15px;font-weight:600;min-height:1.5em"></div>
            <a href="../index.html" id="backLink" style="display:none;margin-top:10px;color:#fff;opacity:0.9">Back to
                the village</a>
        </div>
    </div>

    <script>
        (function () {
            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('gameOverlay');
            const grid = document.getElementById('lanternGrid');
            const result = document.getElementById('result');
            const backLink = document.getElementById('backLink');

            const size = 3;
            let board = []; // 0 = off, 1 = on

            function initGame() {
                // Start with all off
                board = Array(size * size).fill(0);

                // Randomize solvable state
                // We simulate random clicks to ensure it's solvable from all-off state?
                // Actually, "Lights Out" usually starts with some lights ON and goal is OFF.
                // But here user asked "Light the Lanterns", so goal is ALL ON.
                // To ensure solvability for "All On", we can start with "All On" and apply random moves to scramble it.

                board = Array(size * size).fill(1); // Goal state

                // Scramble
                for (let i = 0; i < 10; i++) {
                    const r = Math.floor(Math.random() * (size * size));
                    toggle(r, false); // false = don't check win
                }

                renderBoard();
            }

            function toggle(index, check = true) {
                const row = Math.floor(index / size);
                const col = index % size;

                // Toggle self
                flip(index);

                // Toggle neighbors
                if (row > 0) flip(index - size); // Up
                if (row < size - 1) flip(index + size); // Down
                if (col > 0) flip(index - 1); // Left
                if (col < size - 1) flip(index + 1); // Right

                if (check) {
                    renderBoard();
                    checkWin();
                }
            }

            function flip(i) {
                board[i] = board[i] === 1 ? 0 : 1;
            }

            function renderBoard() {
                grid.innerHTML = '';
                board.forEach((state, i) => {
                    const lantern = document.createElement('div');
                    lantern.className = `lantern ${state === 1 ? 'on' : 'off'}`;
                    lantern.addEventListener('click', () => toggle(i));
                    grid.appendChild(lantern);
                });
            }

            function checkWin() {
                if (board.every(cell => cell === 1)) {
                    gameWon();
                }
            }

            function gameWon() {
                result.style.color = '#7CFC00';
                result.textContent = 'All Lanterns Lit!';
                backLink.style.display = 'block';

                // Disable clicks
                const lanterns = document.querySelectorAll('.lantern');
                lanterns.forEach(l => l.style.pointerEvents = 'none');

                if (typeof triggerStarExplosion === 'function') {
                    triggerStarExplosion();
                }
            }

            function showOverlay() {
                overlay.classList.remove('hidden');
                overlay.setAttribute('aria-hidden', 'false');
                initGame();
            }

            video.addEventListener('ended', showOverlay);
            video.autoplay = true;
        })();
    </script>
    <style>
        .lantern {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .lantern.off {
            background: #333;
            border: 2px solid #555;
        }

        .lantern.on {
            background: #ff7a18;
            /* Orange glow */
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px #ff7a18, inset 0 0 10px #fff;
        }

        .lantern::after {
            /* Handle */
            content: '';
            position: absolute;
            top: -10px;
            left: 25px;
            width: 20px;
            height: 10px;
            background: #222;
            border-radius: 4px 4px 0 0;
        }
    </style>
    <script src="../scripts/utils.js"></script>
</body>

</html>

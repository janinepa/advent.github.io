<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 19</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* full-viewport video */
        .door video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: black;
        }

        /* overlay that appears after video ends */
        .game-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-card {
            background: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        h2 {
            color: #ffd700;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .riddle {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 30px;
            color: #ddd;
            line-height: 1.5;
        }

        .candle-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            min-height: 150px;
            align-items: flex-end;
        }

        .candle {
            width: 40px;
            height: 100px;
            background: linear-gradient(to right, #e0e0e0, #fff, #e0e0e0);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: inset 0 -10px 10px rgba(0, 0, 0, 0.1);
        }

        .candle:hover {
            transform: scale(1.05);
        }

        .candle::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 15px;
            background: #333;
            /* wick */
        }

        /* Candle Colors */
        .candle[data-color="blue"] {
            background: linear-gradient(to right, #4a90e2, #5ca0f2, #4a90e2);
        }

        .candle[data-color="black"] {
            background: linear-gradient(to right, #2c3e50, #4a4a4a, #2c3e50);
        }

        .candle[data-color="green"] {
            background: linear-gradient(to right, #2ecc71, #40d47e, #2ecc71);
        }

        .candle[data-color="yellow"] {
            background: linear-gradient(to right, #f1c40f, #f39c12, #f1c40f);
        }

        /* Flame */
        .flame {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 20px;
            height: 30px;
            background: radial-gradient(ellipse at bottom, #ffff00 0%, #ffad33 60%, #ff3300 100%);
            border-radius: 50% 50% 20% 20%;
            filter: blur(1px);
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #ffad33, 0 0 20px #ffad33;
        }

        .candle.lit .flame {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1) skewX(-2deg);
                opacity: 0.9;
            }

            100% {
                transform: translateX(-50%) scale(1.05) skewX(2deg);
                opacity: 1;
            }
        }

        /* Floating Animation */
        .candle {
            animation: float 3s ease-in-out infinite;
        }

        .candle:nth-child(1) {
            animation-delay: 0s;
        }

        .candle:nth-child(2) {
            animation-delay: 0.5s;
        }

        .candle:nth-child(3) {
            animation-delay: 1s;
        }

        .candle:nth-child(4) {
            animation-delay: 1.5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Stop floating when hovering to make clicking easier */
        .candle:hover {
            animation-play-state: paused;
        }

        #message {
            min-height: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #b89b5e;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .btn.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 19</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-19.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-19.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Game Overlay -->
    <div id="gameOverlay" class="game-overlay">
        <div class="game-card">
            <h2>The Chamber of Floating Flames</h2>
            <p class="riddle">"First the ice, then the night,<br>Then the forest, then the light."</p>

            <div class="candle-container">
                <div class="candle" data-color="blue" title="Ice">
                    <div class="flame"></div>
                </div>
                <div class="candle" data-color="black" title="Night">
                    <div class="flame"></div>
                </div>
                <div class="candle" data-color="green" title="Forest">
                    <div class="flame"></div>
                </div>
                <div class="candle" data-color="yellow" title="Light">
                    <div class="flame"></div>
                </div>
            </div>

            <div id="message"></div>
            <a href="../index.html" id="backBtn" class="btn">Back to the village</a>
        </div>
    </div>

    <script>
        (function () {
            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('gameOverlay');
            const candles = document.querySelectorAll('.candle');
            const message = document.getElementById('message');
            const backBtn = document.getElementById('backBtn');

            // Riddle: Ice (Blue) -> Night (Black) -> Forest (Green) -> Light (Yellow)
            const correctSequence = ['blue', 'black', 'green', 'yellow'];
            let currentSequence = [];
            let isResetting = false;

            function initGame() {
                overlay.classList.add('show');

                // Shuffle candles visually for extra challenge? 
                // Let's keep them in order for now, or shuffle if requested.
                // The user said "Four candles float... Click them in correct order".
                // Randomizing position makes it a bit more of a puzzle.
                const container = document.querySelector('.candle-container');
                for (let i = container.children.length; i >= 0; i--) {
                    container.appendChild(container.children[Math.random() * i | 0]);
                }
            }

            candles.forEach(candle => {
                candle.addEventListener('click', () => {
                    if (isResetting) return;
                    if (candle.classList.contains('lit')) return; // Already lit

                    // Light it up
                    candle.classList.add('lit');
                    const color = candle.dataset.color;
                    currentSequence.push(color);

                    checkSequence();
                });
            });

            function checkSequence() {
                // Check if the sequence so far matches the correct sequence
                const index = currentSequence.length - 1;

                if (currentSequence[index] !== correctSequence[index]) {
                    // Wrong candle!
                    message.style.color = '#FF6B6B';
                    message.textContent = "The flames flicker and die...";
                    isResetting = true;

                    setTimeout(() => {
                        resetCandles();
                    }, 1000);
                } else {
                    // Correct so far
                    if (currentSequence.length === correctSequence.length) {
                        // Win!
                        gameWon();
                    }
                }
            }

            function resetCandles() {
                candles.forEach(c => c.classList.remove('lit'));
                currentSequence = [];
                message.textContent = "";
                isResetting = false;
            }

            function gameWon() {
                message.style.color = '#7CFC00';
                message.textContent = "The magic is restored! You received a spark of starlight.";
                backBtn.classList.add('show');

                if (typeof triggerStarExplosion === 'function') {
                    triggerStarExplosion();
                }
            }

            // Show overlay when video ends
            video.addEventListener('ended', () => {
                initGame();
            });

        })();
    </script>
    <script src="../scripts/utils.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 8</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* full-viewport video */
        .door video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: black;
        }

        /* overlay that appears after video ends */
        .game-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-card {
            background: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(135, 206, 250, 0.3);
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        h2 {
            color: #87CEFA;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(135, 206, 250, 0.5);
        }

        .instruction {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 20px;
        }

        .puzzle-container {
            width: 300px;
            height: 300px;
            margin: 0 auto 20px;
            position: relative;
            background: #333;
            border: 2px solid #87CEFA;
            box-shadow: 0 0 15px rgba(135, 206, 250, 0.3);
        }

        .tile {
            width: 100px;
            height: 100px;
            position: absolute;
            background-image: url('../assets/images/puzzle-day-08.png');
            background-size: 300px 300px;
            cursor: pointer;
            transition: top 0.2s, left 0.2s;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .tile.empty {
            background: none;
            border: none;
            cursor: default;
        }

        #message {
            min-height: 24px;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #87CEFA;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .btn.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 8</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-08.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-08.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Game Overlay -->
    <div id="gameOverlay" class="game-overlay">
        <div class="game-card">
            <h2>Sliding Ice Puzzle</h2>
            <p class="instruction">Slide the tiles to reveal the reindeer!</p>

            <div class="puzzle-container" id="puzzleBoard">
                <!-- Tiles generated by JS -->
            </div>

            <div id="message"></div>
            <a href="../index.html" id="backBtn" class="btn">Back to the village</a>
        </div>
    </div>

    <script>
        (function () {
            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('gameOverlay');
            const board = document.getElementById('puzzleBoard');
            const message = document.getElementById('message');
            const backBtn = document.getElementById('backBtn');

            const size = 3; // 3x3 grid
            let tiles = []; // Array of tile objects {x, y, correctX, correctY, element}
            let emptyTile = { x: 2, y: 2 }; // Start empty at bottom right
            let isSolved = false;

            function initGame() {
                overlay.classList.add('show');
                board.innerHTML = '';
                tiles = [];
                isSolved = false;
                message.textContent = '';

                // Create tiles
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        if (x === size - 1 && y === size - 1) {
                            // Empty slot
                            emptyTile = { x, y };
                            continue;
                        }

                        const tile = document.createElement('div');
                        tile.classList.add('tile');
                        tile.style.backgroundPosition = `-${x * 100}px -${y * 100}px`;

                        // Store state
                        const tileObj = {
                            x,
                            y,
                            correctX: x,
                            correctY: y,
                            element: tile
                        };

                        tiles.push(tileObj);

                        tile.addEventListener('click', () => moveTile(tileObj));
                        board.appendChild(tile);
                    }
                }

                updatePositions();
                shuffleTiles();
            }

            function updatePositions() {
                tiles.forEach(tile => {
                    tile.element.style.left = `${tile.x * 100}px`;
                    tile.element.style.top = `${tile.y * 100}px`;
                });
            }

            function moveTile(tile) {
                if (isSolved) return;

                // Check adjacency to empty slot
                const dx = Math.abs(tile.x - emptyTile.x);
                const dy = Math.abs(tile.y - emptyTile.y);

                if (dx + dy === 1) {
                    // Swap positions
                    const tempX = tile.x;
                    const tempY = tile.y;

                    tile.x = emptyTile.x;
                    tile.y = emptyTile.y;

                    emptyTile.x = tempX;
                    emptyTile.y = tempY;

                    updatePositions();
                    checkWin();
                }
            }

            function shuffleTiles() {
                // Simulate random valid moves to ensure solvability
                for (let i = 0; i < 100; i++) {
                    const neighbors = tiles.filter(t => {
                        const dx = Math.abs(t.x - emptyTile.x);
                        const dy = Math.abs(t.y - emptyTile.y);
                        return dx + dy === 1;
                    });

                    const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];

                    // Swap without checking win
                    const tempX = randomNeighbor.x;
                    const tempY = randomNeighbor.y;
                    randomNeighbor.x = emptyTile.x;
                    randomNeighbor.y = emptyTile.y;
                    emptyTile.x = tempX;
                    emptyTile.y = tempY;
                }
                updatePositions();
            }

            function checkWin() {
                const won = tiles.every(t => t.x === t.correctX && t.y === t.correctY);
                if (won) {
                    isSolved = true;
                    // Fill the empty spot with the last piece if we had one, 
                    // or just show success. 
                    // For this image puzzle, usually we just show success.
                    // Or we could append the missing piece.

                    message.style.color = '#7CFC00';
                    message.textContent = "Puzzle Solved! The path is clear.";
                    backBtn.classList.add('show');

                    if (typeof triggerStarExplosion === 'function') {
                        triggerStarExplosion();
                    }
                }
            }

            // Show overlay when video ends
            video.addEventListener('ended', () => {
                initGame();
            });

        })();
    </script>
    <script src="../scripts/utils.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 17</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* full-viewport video */
        .door video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: black;
        }

        /* overlay that appears after video ends */
        .game-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-card {
            background: rgba(20, 20, 20, 0.95);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(100, 149, 237, 0.3);
            text-align: center;
            max-width: 95vw;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        h2 {
            color: #6495ED;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(100, 149, 237, 0.5);
        }

        .instruction {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 15px;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background: #555;
            border: 2px solid #888;
            margin: 0 auto 20px;
            width: fit-content;
        }

        .cell {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            position: relative;
        }

        .cell input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            text-align: center;
            color: #FFD700;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 0;
            margin: 0;
        }

        .cell input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
        }

        .cell.prefilled {
            background: rgba(255, 255, 255, 0.2);
            font-weight: bold;
            color: #fff;
        }

        /* Thicker borders for 3x3 subgrids */
        .cell:nth-child(3n) {
            border-right: 2px solid #888;
        }

        .cell:nth-child(9n) {
            border-right: none;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #888;
        }

        /* Actually, grid gap handles internal lines, but we want 3x3 emphasis.
           Let's use specific classes applied by JS or smarter CSS.
           The nth-child logic above is tricky with a flat list. 
           Let's rely on JS to add classes for borders.
        */
        .border-right {
            border-right: 2px solid #aaa !important;
        }

        .border-bottom {
            border-bottom: 2px solid #aaa !important;
        }

        #message {
            min-height: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #6495ED;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .btn.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 17</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-17.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-17.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Game Overlay -->
    <div id="gameOverlay" class="game-overlay">
        <div class="game-card">
            <h2>Snowy Sudoku</h2>
            <p class="instruction">Fill in the missing numbers to complete the grid.</p>

            <div class="sudoku-grid" id="grid">
                <!-- Cells generated by JS -->
            </div>

            <div id="message"></div>
            <a href="../index.html" id="backBtn" class="btn">Back to the village</a>
        </div>
    </div>

    <script>
        (function () {
            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('gameOverlay');
            const grid = document.getElementById('grid');
            const message = document.getElementById('message');
            const backBtn = document.getElementById('backBtn');

            // Easy Sudoku Solution
            const solution = [
                5, 3, 4, 6, 7, 8, 9, 1, 2,
                6, 7, 2, 1, 9, 5, 3, 4, 8,
                1, 9, 8, 3, 4, 2, 5, 6, 7,
                8, 5, 9, 7, 6, 1, 4, 2, 3,
                4, 2, 6, 8, 5, 3, 7, 9, 1,
                7, 1, 3, 9, 2, 4, 8, 5, 6,
                9, 6, 1, 5, 3, 7, 2, 8, 4,
                2, 8, 7, 4, 1, 9, 6, 3, 5,
                3, 4, 5, 2, 8, 6, 1, 7, 9
            ];

            // Initial state (0 = empty)
            const initial = [
                5, 3, 0, 0, 7, 0, 0, 0, 0,
                6, 0, 0, 1, 9, 5, 0, 0, 0,
                0, 9, 8, 0, 0, 0, 0, 6, 0,
                8, 0, 0, 0, 6, 0, 0, 0, 3,
                4, 0, 0, 8, 0, 3, 0, 0, 1,
                7, 0, 0, 0, 2, 0, 0, 0, 6,
                0, 6, 0, 0, 0, 0, 2, 8, 0,
                0, 0, 0, 4, 1, 9, 0, 0, 5,
                0, 0, 0, 0, 8, 0, 0, 7, 9
            ];

            let isSolved = false;

            function initGame() {
                overlay.classList.add('show');
                grid.innerHTML = '';
                message.textContent = '';
                isSolved = false;

                initial.forEach((num, index) => {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');

                    // Add borders for 3x3 subgrids
                    const col = index % 9;
                    const row = Math.floor(index / 9);

                    if (col === 2 || col === 5) cell.classList.add('border-right');
                    if (row === 2 || row === 5) cell.classList.add('border-bottom');

                    if (num !== 0) {
                        cell.textContent = num;
                        cell.classList.add('prefilled');
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text'; // 'number' has spinners which look bad
                        input.maxLength = 1;
                        input.inputMode = 'numeric';
                        input.dataset.index = index;

                        input.addEventListener('input', (e) => {
                            // Allow only 1-9
                            const val = e.target.value;
                            if (!/^[1-9]$/.test(val)) {
                                e.target.value = '';
                            }
                            checkWin();
                        });

                        cell.appendChild(input);
                    }
                    grid.appendChild(cell);
                });
            }

            function checkWin() {
                if (isSolved) return;

                const inputs = grid.querySelectorAll('input');
                let allCorrect = true;
                let filledCount = 0;

                // Check inputs
                inputs.forEach(input => {
                    const index = parseInt(input.dataset.index);
                    const val = parseInt(input.value);

                    if (!val) {
                        allCorrect = false;
                    } else {
                        filledCount++;
                        if (val !== solution[index]) {
                            allCorrect = false;
                            // Optional: Highlight wrong numbers?
                            // input.style.color = 'red';
                        } else {
                            // input.style.color = '#FFD700';
                        }
                    }
                });

                // Only trigger win if all inputs are filled and correct
                if (filledCount === inputs.length && allCorrect) {
                    gameWon();
                }
            }

            function gameWon() {
                isSolved = true;
                message.style.color = '#7CFC00';
                message.textContent = "Puzzle Solved! The logic is sound.";
                backBtn.classList.add('show');

                // Disable inputs
                const inputs = grid.querySelectorAll('input');
                inputs.forEach(input => input.disabled = true);

                if (typeof triggerStarExplosion === 'function') {
                    triggerStarExplosion();
                }
            }

            // Show overlay when video ends
            video.addEventListener('ended', () => {
                initGame();
            });

        })();
    </script>
    <script src="../scripts/utils.js"></script>
</body>

</html>

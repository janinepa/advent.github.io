<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 12</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* full-viewport video */
        .door video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: black;
        }

        /* overlay that appears after video ends */
        .game-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-card {
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            max-width: 95vw;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        h2 {
            color: #ffd700;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .instruction {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 0 auto 20px;
            width: fit-content;
        }

        .card {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: transform 0.3s, background 0.3s;
            user-select: none;
            position: relative;
            transform-style: preserve-3d;
        }

        .card.flipped,
        .card.matched {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-content {
            display: none;
        }

        .card.flipped .card-content,
        .card.matched .card-content {
            display: block;
            transform: rotateY(180deg);
            /* Counteract parent rotation if needed, but here we just show it */
        }

        /* Actually, simpler flip: 
           Front/Back logic is complex for simple CSS. 
           Let's just change background and show content. 
        */
        .card .content {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card.flipped .content,
        .card.matched .content {
            opacity: 1;
        }

        #message {
            min-height: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #b89b5e;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .btn.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 12</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-12.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-12.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Game Overlay -->
    <div id="gameOverlay" class="game-overlay">
        <div class="game-card">
            <h2>Snowflake Match</h2>
            <p class="instruction">Find all matching pairs of snowflakes!</p>

            <div class="grid-container" id="grid">
                <!-- Cards generated by JS -->
            </div>

            <div id="message"></div>
            <a href="../index.html" id="backBtn" class="btn">Back to the village</a>
        </div>
    </div>

    <script>
        (function () {
            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('gameOverlay');
            const grid = document.getElementById('grid');
            const message = document.getElementById('message');
            const backBtn = document.getElementById('backBtn');

            const snowflakes = ['❄️', '❤️', '🌲', '☃️', '🌟', '🪷', '🪴', '🌨️'];
            let cards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let isLocked = false;

            function initGame() {
                overlay.classList.add('show');
                grid.innerHTML = '';
                matchedPairs = 0;
                flippedCards = [];
                isLocked = false;

                // Create pairs
                const deck = [...snowflakes, ...snowflakes];
                // Shuffle
                deck.sort(() => Math.random() - 0.5);

                deck.forEach((symbol, index) => {
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.dataset.symbol = symbol;
                    card.dataset.index = index;

                    const content = document.createElement('span');
                    content.classList.add('content');
                    content.textContent = symbol;

                    card.appendChild(content);
                    card.addEventListener('click', () => flipCard(card));

                    grid.appendChild(card);
                });
            }

            function flipCard(card) {
                if (isLocked) return;
                if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

                card.classList.add('flipped');
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    checkForMatch();
                }
            }

            function checkForMatch() {
                isLocked = true;
                const [card1, matchCard] = flippedCards;

                const isMatch = card1.dataset.symbol === matchCard.dataset.symbol;

                if (isMatch) {
                    disableCards();
                } else {
                    unflipCards();
                }
            }

            function disableCards() {
                flippedCards.forEach(card => {
                    card.classList.remove('flipped');
                    card.classList.add('matched');
                });
                flippedCards = [];
                matchedPairs++;
                isLocked = false;

                if (matchedPairs === snowflakes.length) {
                    gameWon();
                }
            }

            function unflipCards() {
                setTimeout(() => {
                    flippedCards.forEach(card => {
                        card.classList.remove('flipped');
                    });
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }

            function gameWon() {
                message.style.color = '#7CFC00';
                message.textContent = "All pairs found! You received a spark of starlight.";
                backBtn.classList.add('show');

                if (typeof triggerStarExplosion === 'function') {
                    triggerStarExplosion();
                }
            }

            // Show overlay when video ends
            video.addEventListener('ended', () => {
                initGame();
            });

        })();
    </script>
    <script src="../scripts/utils.js"></script>
</body>

</html>

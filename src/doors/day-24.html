<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 24</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* overlay that appears after video ends */
        .answer-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            /* disabled until shown */
        }

        .answer-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 24px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            text-align: center;
            min-width: 280px;
            pointer-events: auto;
        }

        .answer-card input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            margin-top: 12px;
            box-sizing: border-box;
        }

        .answer-card button {
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: #ff7a18;
            color: #fff;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 24</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-24.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-24.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script src="../scripts/utils.js"></script>
</body>

</html>

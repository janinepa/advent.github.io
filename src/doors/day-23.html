<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 23</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* full-viewport video */
        .door video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: black;
        }

        /* overlay that appears after video ends */
        .answer-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            /* disabled until shown */
        }

        .answer-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 24px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            text-align: center;
            min-width: 280px;
            pointer-events: auto;
        }

        .cipher-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .cipher-box {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            min-width: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .answer-card input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            margin-top: 12px;
            box-sizing: border-box;
        }

        .answer-card button {
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: #ff7a18;
            color: #fff;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 23</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-23.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-23.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- overlay that shows input after video ends -->
    <div id="answerOverlay" class="answer-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="answer-card">
            <h1>It is almost Christmas! You are so close to finding all the fragments of the star light and save
                Christmas. </h1>
            <p>Can you solve this puzzle?</p>
            <div id="prompt" style="font-size: 1.1rem; margin: 10px 0;">
                <div class="cipher-container">
                    <span class="cipher-box">19</span>
                    <span class="cipher-box">1</span>
                    <span class="cipher-box">14</span>
                    <span class="cipher-box">20</span>
                    <span class="cipher-box">1</span>
                </div>
                <p style="font-size: 0.9rem; color: #ccc;">(A=1, B=2)</p>
            </div>
            <input id="answerInput" type="text" placeholder="Type the word which results from the numbers..."
                aria-label="Answer input" />
            <div>
                <button id="submitBtn">Submit</button>
                <button id="retryBtn" class="hidden">Try again</button>
            </div>
            <div id="result" style="margin-top:12px;font-weight:600"></div>
            <a href="../index.html" style="display:block;margin-top:10px;color:#fff;opacity:0.9">Back to the village</a>
        </div>
    </div>

    <script>
        (function () {
            const correctAnswer = 'santa'; // expected answer (case-insensitive)
            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('answerOverlay');
            const input = document.getElementById('answerInput');
            const submitBtn = document.getElementById('submitBtn');
            const retryBtn = document.getElementById('retryBtn');
            const result = document.getElementById('result');

            function showOverlay() {
                overlay.classList.remove('hidden');
                overlay.setAttribute('aria-hidden', 'false');
                input.value = '';
                result.textContent = '';
                retryBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
                setTimeout(() => input.focus(), 50);
            }

            function hideOverlay() {
                overlay.classList.add('hidden');
                overlay.setAttribute('aria-hidden', 'true');
            }

            function checkAnswer() {
                const val = (input.value || '').trim().toLowerCase();
                if (val === correctAnswer) {
                    result.style.color = '#7CFC00';
                    result.textContent = 'Correct! It\'s Santa! 🎅';
                    triggerStarExplosion(); // Trigger animation
                    submitBtn.classList.add('hidden');
                    retryBtn.classList.add('hidden');
                } else {
                    result.style.color = '#FF6B6B';
                    result.textContent = 'Wrong — try decoding again';
                    retryBtn.classList.remove('hidden');
                }
            }

            // show the overlay when the video ends
            video.addEventListener('ended', showOverlay);

            // allow pressing Enter in the input to submit
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });

            submitBtn.addEventListener('click', checkAnswer);
            retryBtn.addEventListener('click', () => {
                input.value = '';
                input.focus();
                result.textContent = '';
            });

            // Optional: start playing automatically on supported browsers
            // If autoplay is blocked, user can click play (controls are visible).
        })();
    </script>
    <script src="../scripts/utils.js"></script>
</body>

</html>

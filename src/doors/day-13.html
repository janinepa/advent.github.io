<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 13</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* overlay that appears after video ends */
        .answer-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            /* disabled until shown */
        }

        .answer-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 24px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            text-align: center;
            min-width: 280px;
            pointer-events: auto;
        }

        .answer-card button {
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: #ff7a18;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 13</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-13.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-13.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- overlay that shows task after video ends -->
    <div id="answerOverlay" class="answer-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="answer-card">
            <h2 style="color:#ffd700;margin-top:0">Today's Task</h2>
            <div id="prompt" style="font-size:1.2em;margin:20px 0;line-height:1.5">
                Today isn't about screens or puzzles. It's about the world outside. Enjoy nature, take a walk and look
                for animals.
                <br>
                <small style="opacity:0.8;font-size:0.8em">Can you spot a bird, a squirrel, or maybe something
                    else?</small>
            </div>
            <div>
                <button id="submitBtn">I will!</button>
            </div>
            <div id="result" style="margin-top:12px;font-weight:600"></div>
            <a href="../index.html" id="backLink" style="display:none;margin-top:10px;color:#fff;opacity:0.9">Back to
                the village</a>
        </div>
    </div>

    <script>
        (function () {
            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('answerOverlay');
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            const backLink = document.getElementById('backLink');

            function showOverlay() {
                overlay.classList.remove('hidden');
                overlay.setAttribute('aria-hidden', 'false');

            }

            function completeTask() {
                result.style.color = '#7CFC00';
                result.textContent = 'Enjoy your walk! 🌲';
                submitBtn.classList.add('hidden');
                backLink.style.display = 'block';

                if (typeof triggerStarExplosion === 'function') {
                    triggerStarExplosion();
                }
            }

            // show the overlay when the video ends
            video.addEventListener('ended', showOverlay);

            submitBtn.addEventListener('click', completeTask);

            // Optional: start playing automatically on supported browsers
            // If autoplay is blocked, user can click play (controls are visible).
        })();
    </script>
    <script src="../scripts/utils.js"></script>
</body>

</html>

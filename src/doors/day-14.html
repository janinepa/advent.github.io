<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar - Day 14</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        /* make the page background a cozy winter image */
        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #fff;
        }

        /* full-viewport video */
        .door video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: black;
        }

        /* overlay that appears after video ends */
        .answer-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            /* disabled until shown */
        }

        .answer-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 24px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            text-align: center;
            min-width: 280px;
            pointer-events: auto;
        }

        .answer-card input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            margin-top: 12px;
            box-sizing: border-box;
        }

        .answer-card button {
            background: #ff7a18;
            color: #fff;
            cursor: pointer;
        }

        .riddle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            text-align: left;
        }

        .play-btn {
            background: none;
            border: 2px solid #ffd700;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: #ffd700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            padding: 0;
            flex-shrink: 0;
            margin: 0 !important;
            /* Override generic button margin */
        }

        .play-btn.playing {
            background: #ffd700;
            color: #000;
        }

        .clue {
            font-size: 1.5em;
            cursor: help;
        }

        .riddle-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 4px;
            font-size: 0.9em;
            outline: none;
            width: 100%;
        }

        .riddle-input:focus {
            border-bottom-color: #ffd700;
        }

        .status-icon {
            width: 20px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- main door container (video fills viewport) -->
    <div class="door" aria-hidden="false">
        <h1 style="position:fixed;left:16px;top:16px;z-index:3;margin:0;font-size:18px">Day 14</h1>
        <video id="dayVideo" controls playsinline preload="metadata" poster="../assets/images/posters/day-14.jpg">
            <!-- .mov commonly uses video/quicktime -->
            <source src="../assets/videos/day-14.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- overlay that shows input after video ends -->
    <div id="answerOverlay" class="answer-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="answer-card">
            <h2 style="color:#ffd700;margin-top:0">The village bell tower is silent! 🎵</h2>
            <p style="font-size:0.9em;margin-bottom:15px;opacity:0.9">Listen to the music and guess the song to bring
                the clock tower back to life.</p>

            <div id="riddleContainer">
                <!-- Row 1 -->
                <div class="riddle-row">
                    <button class="play-btn" data-song="../assets/music/song1.mp3" aria-label="Play Clip 1">▶️</button>
                    <span class="clue" title="Clue: Hush...">🤫🌃</span>
                    <input type="text" class="riddle-input" data-index="0" placeholder="Song title...">
                    <span class="status-icon" data-index="0"></span>
                </div>

                <!-- Row 2 -->
                <div class="riddle-row">
                    <button class="play-btn" data-song="../assets/music/song2.mp3" aria-label="Play Clip 2">▶️</button>
                    <span class="clue" title="Clue: Dashing through...">🔔🐎</span>
                    <input type="text" class="riddle-input" data-index="1" placeholder="Song title...">
                    <span class="status-icon" data-index="1"></span>
                </div>

                <!-- Row 3 -->
                <div class="riddle-row">
                    <button class="play-btn" data-song="../assets/music/song3.mp3" aria-label="Play Clip 3">▶️</button>
                    <span class="clue" title="Clue: Christmas...">🕰️🎄</span>
                    <input type="text" class="riddle-input" data-index="2" placeholder="Song title...">
                    <span class="status-icon" data-index="2"></span>
                </div>
            </div>

            <div id="feedback" style="margin-top:12px;font-weight:600;min-height:20px"></div>

            <button id="checkBtn"
                style="margin-top:15px;width:100%;background:#ffd700;color:#000;font-weight:bold">Check Answers</button>

            <a href="../index.html" id="backLink" class="hidden"
                style="display:block;margin-top:10px;color:#fff;opacity:0.9">Back to the village</a>
        </div>
    </div>

    <script>
        (function () {
            const songs = [
                { answer: 'silent night', file: 'song1.mp3' },
                { answer: 'jingle bells', file: 'song2.mp3' },
                { answer: 'last christmas', file: 'song3.mp3' }
            ];

            const video = document.getElementById('dayVideo');
            const overlay = document.getElementById('answerOverlay');
            const checkBtn = document.getElementById('checkBtn');
            const feedback = document.getElementById('feedback');
            const backLink = document.getElementById('backLink');
            const inputs = document.querySelectorAll('.riddle-input');
            const statusIcons = document.querySelectorAll('.status-icon');
            const playBtns = document.querySelectorAll('.play-btn');

            let currentAudio = null;



            // Remove video hiding for consistency with recent changes
            video.addEventListener('ended', () => {
                overlay.classList.remove('hidden');
                overlay.setAttribute('aria-hidden', 'false');
            });

            function playAudio(btn) {
                const src = btn.getAttribute('data-song');

                if (currentAudio && currentAudio.src.includes(src.split('/').pop())) {
                    if (currentAudio.paused) {
                        currentAudio.play();
                        btn.textContent = '⏸️';
                        btn.classList.add('playing');
                    } else {
                        currentAudio.pause();
                        btn.textContent = '▶️';
                        btn.classList.remove('playing');
                    }
                    return;
                }

                if (currentAudio) {
                    currentAudio.pause();
                    const prevBtn = document.querySelector('.play-btn.playing');
                    if (prevBtn) {
                        prevBtn.textContent = '▶️';
                        prevBtn.classList.remove('playing');
                    }
                }

                currentAudio = new Audio(src);
                currentAudio.volume = 0.5;
                currentAudio.play().catch(e => {
                    console.warn("Audio play failed (file might be missing):", e);
                    feedback.textContent = "Audio file missing 😢";
                    feedback.style.color = 'orange';
                });

                btn.textContent = '⏸️';
                btn.classList.add('playing');

                currentAudio.onended = () => {
                    btn.textContent = '▶️';
                    btn.classList.remove('playing');
                    currentAudio = null;
                };
            }

            playBtns.forEach(btn => {
                btn.addEventListener('click', () => playAudio(btn));
            });

            checkBtn.addEventListener('click', () => {
                let correctCount = 0;

                inputs.forEach((input, index) => {
                    const val = input.value.trim().toLowerCase();
                    const icon = statusIcons[index];

                    if (val === songs[index].answer) {
                        icon.textContent = '✅';
                        input.style.color = '#7CFC00';
                        input.disabled = true; // Lock correct answers
                        correctCount++;
                    } else {
                        icon.textContent = '❌';
                        input.style.color = '#ff6b6b';
                    }
                });

                if (correctCount === 3) {
                    feedback.textContent = "All correct! 🎅🎶";
                    feedback.style.color = '#7CFC00';
                    checkBtn.classList.add('hidden');
                    backLink.classList.remove('hidden');
                    if (typeof triggerStarExplosion === 'function') triggerStarExplosion();
                } else {
                    feedback.textContent = `${correctCount}/3 Correct. Keep trying!`;
                    feedback.style.color = '#fff';
                }
            });

        })();
    </script>
    <script src="../scripts/utils.js"></script>
</body>

</html>
